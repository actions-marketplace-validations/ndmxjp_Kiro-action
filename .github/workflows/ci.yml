name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The action's bundle runs under the runner's Node, not Bun, so record which
      # version that is: the bundle targets node24 and uses import.meta.main,
      # which silently does nothing on older majors.
      - name: Runtime versions
        run: |
          node --version
          bun --version

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Bundle is current
        run: bun run build:check

      - name: Lint the push wrapper
        run: bash -n scripts/git-push.sh
