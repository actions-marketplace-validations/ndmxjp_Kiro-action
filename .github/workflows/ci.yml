name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun runs the action at run time, so keep its version in the log; node is
      # here only because some tooling reaches for it.
      - name: Runtime versions
        run: |
          bun --version
          node --version

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Lint the push wrapper
        run: bash -n scripts/git-push.sh
