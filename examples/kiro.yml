# Tag mode: respond when someone writes "@kiro" on an issue or pull request,
# labels an issue "kiro", or assigns it.
name: Kiro

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled, assigned]

jobs:
  kiro:
    # Skip the job unless a trigger is plausible, so a runner is not started for
    # every comment in the repository.
    if: |
      contains(github.event.comment.body, '@kiro') ||
      contains(github.event.review.body, '@kiro') ||
      contains(github.event.issue.body, '@kiro') ||
      contains(github.event.issue.title, '@kiro') ||
      github.event.action == 'labeled' ||
      github.event.action == 'assigned'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read # lets Kiro read CI results on a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so diffs against the base branch work.
          fetch-depth: 0

      - uses: ndmxjp/Kiro-action@v0
        with:
          kiro_api_key: ${{ secrets.KIRO_API_KEY }}
          timeout_minutes: 20
          # Commands Kiro may run, so it can check its own work. Read-only git is
          # always allowed; everything else has to be listed here. The action
          # does the committing and pushing. See docs/security.md.
          allowed_shell_commands: "bun install,bun test *,bun run lint"
